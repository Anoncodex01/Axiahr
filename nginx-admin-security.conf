# Nginx Security Configuration for Admin Panel
# Add these rules to your Nginx configuration

# Block admin routes from being indexed by search engines
location ~ ^/admin {
    # Add noindex header
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Optional: IP whitelist (uncomment and add your IPs)
    # allow 192.168.1.0/24;  # Your office network
    # allow 203.0.113.0/24;   # Your home IP range
    # deny all;
    
    # Proxy to Next.js
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# Block API routes from direct access (they should be called from frontend)
location ~ ^/api/admin {
    # Optional: IP whitelist for API
    # allow 127.0.0.1;
    # allow 192.168.1.0/24;
    # deny all;
    
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

